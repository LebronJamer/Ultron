name: Build Ultron Windows Installer

on:
  push:
    branches: ["main", "arena/**"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r UltronV1/requirements.txt
          pip install pyinstaller

      - name: Self-check (static analysis)
        run: python UltronV1/scripts/selfcheck.py

      - name: Download offline speech model
        run: powershell -NoProfile -ExecutionPolicy Bypass -File UltronV1/scripts/download_models.ps1

      - name: GUI smoke test
        timeout-minutes: 3
        run: python UltronV1/scripts/gui_smoke.py

      - name: Functional tests
        timeout-minutes: 5
        run: python UltronV1/scripts/test_functional.py

      - name: Build Ultron.exe (PyInstaller)
        run: pyinstaller --noconfirm --clean --distpath UltronV1/dist --workpath UltronV1/build UltronV1/scripts/ultron.spec

      - name: Build setup.exe (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "ISCC.exe" }
          $ver = (Select-String -Path UltronV1/app/__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "Building installer for version $ver"
          & $iscc "/DMyAppVersion=$ver" "UltronV1\installer\ultron.iss"
          Get-ChildItem -Recurse UltronV1/installer/Output | Select-Object FullName, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ultron-Windows-Setup
          path: UltronV1/installer/Output/*.exe
          if-no-files-found: error

      - name: Upload raw app artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: Ultron-Windows-Portable
          path: UltronV1/dist/Ultron/
          if-no-files-found: error

  release:
    # Attach the setup.exe to a GitHub Release when a v* tag is pushed
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: Ultron-Windows-Setup
          path: dist

      - name: Create release with setup.exe
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
